<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنصة | Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; }
        input, select { color: black !important; font-weight: bold; }
        .api-key-box { font-family: monospace; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: #38bdf8; font-size: 10px; }
        .nfc-link-box { font-size: 10px; color: #94a3b8; word-break: break-all; background: #0f172a; padding: 8px; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl gap-4">
            <h1 class="text-2xl font-black text-blue-500 italic uppercase tracking-tighter">Mawjat Super Admin</h1>
            <div id="auth_form" class="flex gap-2 w-full md:w-auto">
                <input id="admin_pass" type="password" placeholder="كلمة مرور النظام" class="p-3 rounded-xl outline-none flex-grow md:w-48 text-black shadow-inner">
                <button onclick="load()" class="bg-blue-600 px-8 py-3 rounded-xl font-black hover:bg-blue-500 transition shadow-lg shadow-blue-900/20">دخول</button>
            </div>
            <button id="logout_btn" onclick="logout()" class="hidden bg-rose-600 hover:bg-rose-700 px-6 py-3 rounded-xl font-black transition w-full md:w-auto">خروج آمن</button>
        </header>

        <div id="dash" class="hidden space-y-8">
            <div class="grid lg:grid-cols-4 gap-8">
                <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 space-y-4 shadow-xl h-fit">
                    <h3 class="text-blue-400 font-black italic mb-4">➕ تفعيل شريك جديد</h3>
                    <input id="n" type="text" placeholder="اسم المنشأة" class="w-full p-3 rounded-xl border-none text-sm">
                    <input id="nfcId" type="text" placeholder="ID (مثلاً: 101)" class="w-full p-3 rounded-xl border-none text-sm font-bold bg-blue-50">
                    <input id="k" type="text" placeholder="API Key السري" class="w-full p-3 rounded-xl border-none text-sm font-mono">
                    <input id="g" type="text" placeholder="رابط Google Maps" class="w-full p-3 rounded-xl border-none text-sm">
                    <input id="p" type="text" placeholder="جوال المدير (966...)" class="w-full p-3 rounded-xl border-none text-sm">
                    
                    <div class="flex gap-2 text-xs">
                        <select id="plan" class="w-1/2 p-3 rounded-xl border-none text-black">
                            <option value="Starter">باقة المنطلق</option>
                            <option value="Pro">باقة التوسع</option>
                        </select>
                        <select id="dur" class="w-1/2 p-3 rounded-xl border-none text-black">
                            <option value="monthly">شهري</option>
                            <option value="yearly">سنوي</option>
                        </select>
                    </div>
                    <button onclick="add()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black shadow-lg hover:bg-blue-500 transition transform active:scale-95">تفعيل الحساب</button>
                </div>

                <div class="lg:col-span-3 bg-slate-800 rounded-[2.5rem] border border-slate-700 overflow-hidden shadow-xl">
                    <div class="p-6 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                        <h4 class="font-black text-slate-300">قائمة الشركاء والروابط الودودة</h4>
                        <span class="text-xs text-slate-500 font-bold">المشتركين: <span id="client_count">0</span></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-sm">
                            <thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-black">
                                <tr>
                                    <th class="p-5">المنشأة والبيانات</th>
                                    <th class="p-5">رابط NFC (النص الودود)</th>
                                    <th class="p-5 text-center">الباقة</th>
                                    <th class="p-5 text-center">تحكم</th>
                                </tr>
                            </thead>
                            <tbody id="list" class="divide-y divide-slate-700/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // *** رقم البوت الرسمي (عدله هنا) ***
        const BOT_NUMBER = "966567156070"; 

        function getP() { return document.getElementById('admin_pass').value || localStorage.getItem('ap'); }

        async function load(forcedPass = null) {
            let pass = forcedPass || getP();
            if(!pass) return;

            try {
                const res = await fetch('/api/super-admin/clients', { headers: { 'x-admin-password': pass } });
                if(res.ok) {
                    localStorage.setItem('ap', pass); 
                    document.getElementById('dash').classList.remove('hidden');
                    document.getElementById('auth_form').classList.add('hidden');
                    document.getElementById('logout_btn').classList.remove('hidden');
                    
                    const data = await res.json();
                    document.getElementById('client_count').innerText = data.length;
                    document.getElementById('list').innerHTML = data.map(c => {
                        // توليد النص الودود للعميل
                        const friendlyText = `مرحباً ${c.name}، أود تقييم تجربتي معكم اليوم.. شكراً لكم. (Ref: ${c.nfc_id || '000'})`;
                        const nfcLink = `https://wa.me/${BOT_NUMBER}?text=${encodeURIComponent(friendlyText)}`;

                        return `
                        <tr class="hover:bg-slate-700/30 transition-colors">
                            <td class="p-5">
                                <div class="font-black text-blue-300 mb-1">${c.name}</div>
                                <div class="flex gap-2">
                                    <span class="api-key-box">ID: ${c.nfc_id || '---'}</span>
                                    <span class="api-key-box italic">🔑 ${c.api_key}</span>
                                </div>
                            </td>
                            <td class="p-5 w-2/5">
                                <div class="nfc-link-box mb-2 italic">"${friendlyText}"</div>
                                <button onclick="copyLink('${nfcLink}')" class="text-[10px] bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold hover:bg-emerald-500 transition shadow-lg shadow-emerald-900/20">نسخ رابط البرمجة 📋</button>
                            </td>
                            <td class="p-5 text-center">
                                <span class="bg-slate-700 px-3 py-1 rounded-full text-[10px] font-bold">${c.plan}</span>
                            </td>
                            <td class="p-5 text-center">
                                <button onclick="deleteClient('${c.id}')" class="text-rose-500 hover:text-rose-300 font-black">حذف</button>
                            </td>
                        </tr>
                    `}).join('');
                } else {
                    localStorage.removeItem('ap');
                    alert('خطأ في كلمة المرور');
                }
            } catch(e) { alert('خطأ في الاتصال بالخادم'); }
        }

        function copyLink(text) {
            navigator.clipboard.writeText(text);
            alert('✅ تم نسخ الرابط الودود! برمج بطاقة الـ NFC الآن.');
        }

        async function add() {
            const pass = getP();
            const data = { 
                name: document.getElementById('n').value,
                nfcId: document.getElementById('nfcId').value,
                apiKey: document.getElementById('k').value, 
                googleLink: document.getElementById('g').value, 
                adminPhone: document.getElementById('p').value, 
                plan: document.getElementById('plan').value, 
                durationType: document.getElementById('dur').value 
            };
            
            if(!data.name || !data.nfcId) return alert('يرجى تعبئة الاسم والـ ID');
            
            const res = await fetch('/api/clients/add', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'x-admin-password': pass }, 
                body: JSON.stringify(data) 
            });
            if(res.ok) { 
                alert('✅ تم التفعيل'); 
                load(); 
                document.querySelectorAll('input:not(#admin_pass)').forEach(i => i.value = '');
            } else {
                alert('فشل الإضافة، ربما الـ ID مكرر');
            }
        }

        async function deleteClient(id) {
            if(!confirm('🚨 حذف نهائي؟')) return;
            await fetch(`/api/clients/${id}`, { method: 'DELETE', headers: { 'x-admin-password': getP() } });
            load();
        }

        function logout() { localStorage.removeItem('ap'); location.reload(); }
        window.onload = () => { if(localStorage.getItem('ap')) load(); };
    </script>
</body>
</html>
